<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <radialGradient id="g1" cx="75%" cy="-10%" r="60%"><stop offset="0%" stop-color="#6f7ff2" stop-opacity="0.13"/><stop offset="100%" stop-color="#6f7ff2" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="8%" cy="112%" r="55%"><stop offset="0%" stop-color="#f5b83d" stop-opacity="0.07"/><stop offset="100%" stop-color="#f5b83d" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="720" fill="#07080f"/>
  <rect width="1280" height="720" fill="url(#g1)"/>
  <rect width="1280" height="720" fill="url(#g2)"/>
  <circle cx="120" cy="90" r="1.6" fill="#aab5ff" opacity="0.18"/><circle cx="330" cy="70" r="1.6" fill="#aab5ff" opacity="0.24"/><circle cx="520" cy="110" r="1.6" fill="#aab5ff" opacity="0.3"/><circle cx="980" cy="80" r="1.6" fill="#aab5ff" opacity="0.18"/><circle cx="1140" cy="260" r="1.6" fill="#aab5ff" opacity="0.24"/><circle cx="90" cy="470" r="1.6" fill="#aab5ff" opacity="0.3"/><circle cx="1180" cy="520" r="1.6" fill="#aab5ff" opacity="0.18"/><circle cx="640" cy="140" r="1.6" fill="#aab5ff" opacity="0.24"/><circle cx="420" cy="520" r="1.6" fill="#aab5ff" opacity="0.3"/><circle cx="760" cy="560" r="1.6" fill="#aab5ff" opacity="0.18"/><circle cx="210" cy="600" r="1.6" fill="#aab5ff" opacity="0.24"/><circle cx="1080" cy="150" r="1.6" fill="#aab5ff" opacity="0.3"/>
  
  <text x="640" y="150" font-family="'JetBrains Mono','Consolas',monospace" font-size="16" font-weight="400" fill="#ff9d7a" text-anchor="middle" letter-spacing="3" opacity="1">THE PROBLEM</text>
  <text x="640" y="222" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="40" font-weight="600" fill="#f2f4fa" text-anchor="middle" letter-spacing="0" opacity="1">Students are drowning in material —</text>
  <text x="640" y="274" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="40" font-weight="600" fill="#f2f4fa" text-anchor="middle" letter-spacing="0" opacity="1">and can't trust the AI that summarises it.</text>
  <rect x="100" y="360" width="360" height="150" rx="16" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.09)"/><text x="124" y="418" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="18" font-weight="400" fill="#f2f4fa" text-anchor="start" letter-spacing="0" opacity="1">“500 pages a day.</text><text x="124" y="450" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="18" font-weight="400" fill="#f2f4fa" text-anchor="start" letter-spacing="0" opacity="1">Law school is self-taught.”</text><text x="124" y="482" font-family="'Instrument Sans','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#a6acbe" text-anchor="start" letter-spacing="0" opacity="1">— a real student</text>
  <rect x="480" y="360" width="360" height="150" rx="16" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.09)"/><text x="504" y="418" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="18" font-weight="400" fill="#f2f4fa" text-anchor="start" letter-spacing="0" opacity="1">“The AI gave me case</text><text x="504" y="450" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="18" font-weight="400" fill="#f2f4fa" text-anchor="start" letter-spacing="0" opacity="1">law that doesn't exist.”</text><text x="504" y="482" font-family="'Instrument Sans','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#a6acbe" text-anchor="start" letter-spacing="0" opacity="1">— a real student</text>
  <rect x="860" y="360" width="360" height="150" rx="16" fill="rgba(255,255,255,0.035)" stroke="rgba(255,255,255,0.09)"/><text x="884" y="418" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="18" font-weight="400" fill="#f2f4fa" text-anchor="start" letter-spacing="0" opacity="1">“I recognise it — then</text><text x="884" y="450" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="18" font-weight="400" fill="#f2f4fa" text-anchor="start" letter-spacing="0" opacity="1">freeze in the exam.”</text><text x="884" y="482" font-family="'Instrument Sans','Segoe UI',Arial,sans-serif" font-size="13" font-weight="400" fill="#a6acbe" text-anchor="start" letter-spacing="0" opacity="1">— a real student</text>
  <text x="640" y="600" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="22" font-weight="500" fill="#aab5ff" text-anchor="middle" letter-spacing="0" opacity="1">Constella fixes all three.</text>

  
  <rect x="0" y="650" width="1280" height="70" fill="rgba(7,8,15,0.66)"/>
  <text x="640" y="692" font-family="'Space Grotesk','Segoe UI',Arial,sans-serif" font-size="22" font-weight="500" fill="#ccd1de" text-anchor="middle" letter-spacing="0" opacity="1">The problem we set out to solve.</text>
</svg>